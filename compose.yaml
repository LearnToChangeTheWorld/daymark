services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - inbox_data:/data
    networks:
      - inbox
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env before deploying}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - inbox
    depends_on:
      - app
volumes:
  inbox_data:
  caddy_data:
  caddy_config:
networks:
  inbox:
